[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwatch-stream"
version = "0.3.1"
description = "Watches a live Kafka event stream for model and data drift"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "confluent-kafka>=2.3",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
driftwatch-consumer = "driftwatch.consumer:main"
driftwatch-api = "driftwatch.api:main"

[tool.setuptools.packages.find]
include = ["driftwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
